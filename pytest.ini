[pytest]
# One documented run: `python -m pytest` from the repo root.
#   tests/contract/  the refactor contract (REFACTOR-PLAN phase 1)
#   tests/unit/      unit tests, on synthetic / public fixtures (tests/fixtures/)
#   public/tests/    the public overlay's own tests (dropped from the export's ini)
testpaths = tests
addopts = -p no:cacheprovider
# pytest's default list skips any dir named `build` — which is a contract area.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch} __pycache__
markers =
    known_gap: pins the CORRECT behaviour for a defect the refactor fixes; strict xfail until then
