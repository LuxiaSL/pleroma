[pytest]
# One documented run: `python -m pytest` from the repo root.
#   tests/contract/  the contract: behaviour the package is held to
#   tests/unit/      unit tests, on synthetic / public fixtures (tests/fixtures/)
testpaths = tests
addopts = -p no:cacheprovider
# anamnesis is a git submodule pinned at vendor/anamnesis; its package dir is
# vendor/anamnesis/anamnesis, so the SUBMODULE ROOT goes on the path, ahead of
# any installed copy. Without a checkout the entry is inert and the installed
# dependency (the same pin, pyproject.toml) is imported instead.
pythonpath = vendor/anamnesis
# pytest's default list skips any dir named `build` — which is a contract area.
norecursedirs = *.egg .* _darcs CVS dist node_modules venv {arch} __pycache__
markers =
    known_gap: pins the CORRECT behaviour for a known defect; strict xfail until it is fixed
