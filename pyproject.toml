[project]
name = "pleroma"
version = "0.1.0"
description = "Loom v0 — sample a conversation's futures, read each future's computational signature, and steer the present toward the one you pick"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Luxia" },
]

dependencies = [
    "torch>=2.1",
    "transformers>=4.36",
    "accelerate>=0.30",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "tqdm>=4.66",
]

[tool.setuptools]
packages = ["pleroma", "anamnesis", "kvrot"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
